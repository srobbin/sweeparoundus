<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Too many requests (429)</title>
  <style>
    body { margin: 0; padding: 1.5rem; background: #f0f9ff; color: #0c4a6e; font: 1rem/1.6 system-ui, sans-serif; }
    main { max-width: 32rem; margin: 10vh auto; padding: 1.5rem; background: white; border-radius: .75rem; }
    h1 { font-size: 1.5rem; line-height: 1.3; }
    a { color: #075985; text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid #0284c7; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Too many requests</h1>
    <p>Please wait a few minutes before trying again. This limit helps protect searches and prevent unwanted emails.</p>
    <p>If you're on a shared network, other visitors may also count toward this limit.</p>
    <p><a href="/">Return to the home page</a></p>
  </main>
</body>
</html>
