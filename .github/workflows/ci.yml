name: CI

# Runs the full RSpec suite on every PR into main. This is the authoritative
# validation gate — configure it as a required status check in branch
# protection. It also validates the automated db/data candidate PRs opened by
# CheckSweepingDataUpdatesJob: the spec/data/* specs read the canonical
# db/data/...<Time.current.year> paths, so on a current-year data PR the CI
# run-year matches the dataset year (the job only ever fetches the current
# year), and the specs validate the candidate with no extra code.
on:
  pull_request:
    branches: [ main ]

jobs:
  rspec:
    runs-on: ubuntu-latest
    container:
      image: ruby:4.0.5-slim

    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      # App config the suite depends on. These mirror the keys docker-compose
      # loads from .env locally; CI has no .env so they must be set explicitly.
      # All values are non-secret test stand-ins.
      SECRET_KEY_BASE: ci-secret-key-base
      SECRET_KEY_JWT: ci-secret-key-jwt
      SITE_NAME: We The Sweeple
      SITE_URL: http://example.com
      DEFAULT_EMAIL: no.reply@example.com
      COFFEE_LINK_URL: https://example.com/coffee
      ADMIN_PATH: sau_admin
      # Must be non-blank so GoogleGeocoder issues the HTTP request that WebMock
      # stubs; a blank key makes it short-circuit before the stubbed request.
      GOOGLE_MAPS_BACKEND_API_KEY: ci-test-key
      GOOGLE_MAPS_FRONTEND_API_KEY: ci-test-key

    steps:
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential libpq-dev postgresql-client libgeos-dev libyaml-dev git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: /usr/local/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install gems
        run: |
          gem install bundler -v 4.0.10
          bundle config set --local without 'development'
          bundle install --jobs 4 --retry 3

      - name: Prepare test database
        run: bin/rails db:test:prepare

      # app/assets/builds/* is gitignored, so the compiled CSS the layout links
      # (tailwind.css, application.css) must be generated here or sprockets
      # raises "asset is not present in the asset pipeline" while rendering.
      - name: Build CSS assets
        run: |
          bin/rails tailwindcss:build
          bin/rails dartsass:build

      - name: Run RSpec
        run: bundle exec rspec
