sync_cdot_permits:
  cron: "5 4 * * * America/Chicago"
  class: "SyncCdotPermitsJob"

cleanup_stale_cdot_permits:
  cron: "0 5 * * * America/Chicago"
  class: "CleanupStaleCdotPermitsJob"

backfill_permit_segment_geocoding:
  cron: "30 5 * * * America/Chicago"
  class: "BackfillPermitSegmentGeocodingJob"

send_permit_alerts:
  cron: "0 6 * * * America/Chicago"
  class: "SendPermitAlertsJob"

send_alerts:
  cron: "0 10 * * * America/Chicago"
  class: "SendAlertsJob"

# In-season only: the 3-11 month range trims winter wake-ups; the job's own
# Mar 20 / Nov 30 guard enforces the precise season boundaries.
check_sweeping_data_updates:
  cron: "15 16 * 3-11 * America/Chicago"
  class: "CheckSweepingDataUpdatesJob"
